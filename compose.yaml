services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: livepoll
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8088}
    depends_on: [mongo, redis]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports: ["8088:80"]
    depends_on: [backend]
volumes:
  mongo_data:
